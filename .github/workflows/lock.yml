# Resolve the pins into composer.lock and commit it to the branch it ran on (ADR 0052). Run by hand after a pin changes
# in composer.json, or with `add` to bring in a newly allowed plugin (its allowlist entry already on the branch): the
# newest stable version is resolved and pinned exactly in composer.json. Needs PLUGIN_REPO_TOKEN (read access to
# oncloud-wordpress-plugin). A commit made with GITHUB_TOKEN starts no other workflow: run `build` afterwards.
name: lock

on:
  workflow_dispatch:
    inputs:
      add:
        description: A package to add and pin (e.g. wpackagist-plugin/polylang); empty to refresh the lock only
        required: false
        default: ''

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.PLUGIN_REPO_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', tools: composer, extensions: mysqli, gd, intl, zip, exif, bcmath }
      - name: Add and pin, or refresh
        env:
          ADD: ${{ inputs.add }}
        run: |
          if [ -n "$ADD" ]; then
            composer require "$ADD" --no-install --no-interaction --no-progress
            version="$(composer show --locked "$ADD" --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')"
            composer require "$ADD:$version" --no-install --no-interaction --no-progress
            echo "Pinned $ADD $version"
          else
            composer update --no-dev --no-install --no-interaction --no-progress
          fi
      - run: php bin/check.php
      - name: Commit when it changed
        run: |
          git add composer.json composer.lock
          if git diff --cached --quiet; then echo "composer.json and composer.lock unchanged"; exit 0; fi
          git -c user.name="oncloud-ci" -c user.email="ci@oncloud.om" commit -m "chore: ${{ inputs.add && format('pin {0}', inputs.add) || 'composer.lock' }} from the lock workflow (run ${GITHUB_RUN_ID})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
