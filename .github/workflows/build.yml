# OnCloud WordPress (ADR 0052): check, build both images, start a clean site from them, and publish the images.
# Secret PLUGIN_REPO_TOKEN: a fine-grained GitHub token with read access to waddah-alraisi/oncloud-wordpress-plugin.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', tools: composer }
      - run: composer validate --no-check-lock --no-check-publish
      - run: php bin/check.php
      - run: php tests/run.php

  site:
    needs: check
    runs-on: ubuntu-24.04
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.PLUGIN_REPO_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v5
      - name: Environment for a throwaway site
        run: |
          cp .env.example .env
          sed -i 's|^ONCLOUD_ENV=.*|ONCLOUD_ENV=staging|' .env
          for key in AUTH_KEY SECURE_AUTH_KEY LOGGED_IN_KEY NONCE_KEY AUTH_SALT SECURE_AUTH_SALT LOGGED_IN_SALT NONCE_SALT; do
            sed -i "s|^$key=.*|$key=$(openssl rand -hex 32)|" .env
          done
      - run: docker compose build
      - run: docker compose up -d
      - name: Install a Storefront site, lockdown on (staging)
        run: |
          for i in $(seq 1 30); do docker compose exec -T db mariadb -uoncloud -poncloud -e 'select 1' oncloud && break; sleep 2; done
          docker compose exec -T php bin/install.sh "OnCloud CI" ci@oncloud.om bakery
      - name: The site answers, locked down
        run: |
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/
          curl -fsSI http://localhost:8080/ | grep -i '^x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/xmlrpc.php)" = 403
          docker compose exec -T php vendor/bin/wp --path=web/wp plugin list --status=active --field=name | tee active.txt
          grep -qx woocommerce active.txt
          grep -qx polylang active.txt
          docker compose exec -T php vendor/bin/wp --path=web/wp eval 'echo DISALLOW_FILE_MODS ? "locked" : "open";' | grep -x locked
      - name: The companion takes OnCloud's articles and case studies, signed only (plan 4.3)
        run: |
          docker compose exec -T php vendor/bin/wp --path=web/wp eval 'echo ONCLOUD_VERSION, " ", post_type_exists("case_study") ? "case_study" : "none";' | grep -x '0.4.1 case_study'
          # Unsigned, on plain permalinks as OnCloud calls them: refused by the companion (401), not by nginx (405).
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT 'http://localhost:8080/?rest_route=/oncloud/v1/posts/01CITEST')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE 'http://localhost:8080/?rest_route=/oncloud/v1/posts/01CITEST')" = 401
      - name: Every template in English and Arabic (plan 4.4)
        run: |
          wp() { docker compose exec -T php vendor/bin/wp --path=web/wp "$@"; }
          need() { grep -q -- "$2" "$1" || { echo "MISSING in $1: $2"; grep -o '<html[^>]*>' "$1"; head -c 3000 "$1"; exit 1; }; }
          wp eval 'echo implode(",", pll_languages_list(["fields" => "slug"]));' | tee langs.txt
          grep -qx 'en,ar' langs.txt
          wp eval-file - < tests/ci-content.php | tee pages.txt
          for p in article-en article-ar study-en study-ar; do
            curl -fsS "http://localhost:8080$(grep "^$p " pages.txt | cut -d' ' -f2)" > "$p.html"
          done
          need article-en.html 'How we moved to the cloud'
          need article-en.html 'wp-block-oncloud-author">Sara Al Hinai'
          need article-en.html 'application/ld+json'
          need article-en.html 'property="og:title" content="How we moved to the cloud — OnCloud CI"'
          need article-en.html 'name="description" content="What a year took."'
          need article-ar.html 'dir="rtl"'
          need article-ar.html 'سارة الهنائية'
          need article-ar.html 'hreflang="en'
          need study-en.html 'wp-block-oncloud-type-label">Case study'
          need study-ar.html 'dir="rtl"'
          need study-ar.html 'wp-block-oncloud-type-label'
          curl -fsS http://localhost:8080/case-studies/ > archive-en.html
          need archive-en.html 'Al Bustan Logistics'
          curl -fsS http://localhost:8080/ > home-en.html
          need home-en.html 'How we moved to the cloud'
          curl -fsS http://localhost:8080/ar/ > home-ar.html
          need home-ar.html 'dir="rtl"'
      - name: The lock file this build resolved
        run: docker compose run --rm --no-deps -T php cat composer.lock > composer.lock
      - uses: actions/upload-artifact@v4
        with: { name: composer.lock, path: composer.lock }
      - if: always()
        run: docker compose logs --no-color | tail -200

  publish:
    needs: site
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Tags
        id: tags
        run: |
          v="$(cat VERSION)"
          base=ghcr.io/waddah-alraisi/oncloud-wordpress
          for t in php nginx; do
            tags="$base-$t:sha-${GITHUB_SHA::12}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags,$base-$t:$v"; fi
            echo "$t=$tags" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: php
          push: true
          tags: ${{ steps.tags.outputs.php }}
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.PLUGIN_REPO_TOKEN }}"}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: nginx
          push: true
          tags: ${{ steps.tags.outputs.nginx }}
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.PLUGIN_REPO_TOKEN }}"}}
