# OnCloud WordPress (ADR 0052): one server block for every site; WordPress picks the site by its host.
server {
    listen 80 default_server;
    server_name _;
    root /srv/site/web;
    index index.php;
    client_max_body_size 32m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Core lives in /wp: the network's admin and login addresses map into it.
    rewrite ^/(wp-.*\.php)$ /wp/$1 last;
    rewrite ^/(wp-(content|admin|includes).*) /wp/$1 last;

    location = /xmlrpc.php { return 403; }
    location ~ /\. { deny all; }
    location ~* ^/app/uploads/.*\.php$ { deny all; }

    # The site's root goes to WordPress for every method: through the directory index, nginx answers 405 to a PUT or
    # DELETE, and OnCloud's signed calls on plain permalinks are /?rest_route=… (24 Oct 2026). The query string stays.
    location = / {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_pass php:9000;
    }

    location ~* \.(css|js|woff2|svg|png|jpe?g|webp|avif|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
