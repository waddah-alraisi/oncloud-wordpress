# AN ONCLOUD WORDPRESS SERVER IN PRODUCTION (decision 10, 25 Oct 2026): a DigitalOcean droplet running Docker. The
# same file runs the shared network (`oncloud-sites-1`, ONCLOUD_NETWORK=1) and a Private Store (one droplet, one site,
# ONCLOUD_NETWORK=0). Nothing is built here: the php and nginx images are the ones CI built and tested, pulled from
# ghcr.io at the tag in ONCLOUD_IMAGE_TAG. An update is a new tag and `docker compose pull && docker compose up -d`.
#
#   caddy   the only public port (80, 443): HTTPS per host, issued on demand (Caddyfile), then to nginx
#   nginx   static files, PHP to php:9000
#   php     WordPress (core, plugins, the companion, the theme), configured only by .env
#   db      MariaDB, on this server's disk
#   cache   Valkey, the object cache
#
#   docker compose -f deploy/compose.production.yaml --env-file deploy/.env up -d
services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required — the address Let's Encrypt writes to about certificates}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [nginx]
  nginx:
    image: ghcr.io/waddah-alraisi/oncloud-wordpress-nginx:${ONCLOUD_IMAGE_TAG:?ONCLOUD_IMAGE_TAG is required}
    restart: unless-stopped
    depends_on: [php]
    volumes: [uploads:/srv/site/web/app/uploads:ro]
  php:
    image: ghcr.io/waddah-alraisi/oncloud-wordpress-php:${ONCLOUD_IMAGE_TAG:?ONCLOUD_IMAGE_TAG is required}
    restart: unless-stopped
    env_file: .env
    depends_on: [db, cache]
    volumes: [uploads:/srv/site/web/app/uploads]
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes: [db:/var/lib/mysql]
  cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
volumes: { uploads: {}, db: {}, caddy_data: {}, caddy_config: {} }
