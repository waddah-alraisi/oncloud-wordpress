# FORGE → the site → Edit Nginx Configuration (decision 10, 27 Oct 2026). Paste these lines inside Forge's
# `server { … }` block for the site, ABOVE Forge's own `location / { … }` block, then DELETE Forge's `location /`
# block (the one below replaces it). Leave Forge's SSL, `include forge-conf/…` and `location ~ \.php$` lines as they
# are. The site's web directory must be `/web`.

    client_max_body_size 32m;

    # Core lives in /wp: the network's admin and login addresses map into it.
    rewrite ^/(wp-.*\.php)$ /wp/$1 last;
    rewrite ^/(wp-(content|admin|includes).*) /wp/$1 last;

    location = /xmlrpc.php { return 403; }
    location ~* ^/app/uploads/.*\.php$ { deny all; }
    # The certificate check is for the Docker set-up's Caddy only; Forge issues its own certificates.
    location = /oncloud-tls.php { return 404; }

    # The site's root goes to WordPress for every method: OnCloud's signed calls on plain permalinks are
    # PUT and DELETE to /?rest_route=…, which the directory index would answer 405.
    location = / {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
